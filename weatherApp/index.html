<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <meta http-equiv="refresh" content="120"> -->
    <title>Julian's Weather App</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Noto+Sans+Mono:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav-bar">
        <a class="nav-bar-lnk" href="/">Home</a>
        <a class="nav-bar-lnk" href="/weatherApp">Weather</a>
    </nav>

    <video autoplay muted loop playsinline id="bg-video"></video>

    <div id="loading">Loading weather...</div>

    <h1 class="heading-black" id="location"></h1>

    <div id="weather">
        <h1 id="curr-temp"></h1>
        <h2 id="feelslike-temp"></h2>
        <img id="curr-condition"></img>
        <br>
        <button id="show-detailed">Details</button>
        <div id="detailed" class="hidden"></div>

        <h1 class="heading-black">3 Day Forecast</h1>

        <div id="forecast">
            <div id="day1" class="fc-day"></div>
            <div id="day2" class="fc-day"></div>
            <div id="day3" class="fc-day"></div>
            
            <div class="hidden" id="detailed-fc-container">
                <div id="detailed-fc" class="detailed-fc"></div>
            </div>
            
        </div>
    </div>

    <footer>
        <a href="/legal/legalNotice/">Imprint</a>
        <a href="https://www.weatherapi.com/" title="Free Weather API" target="_blank"><img src='//cdn.weatherapi.com/v4/images/weatherapi_logo.png' alt="Weather data by WeatherAPI.com"></a>
        <a href="https://www.geosphere.at/de" title="Weather Warnings"><img src="https://www.geosphere.at/static/media/Logo.9bc86c1a.svg" alt="Weather Warnings by Geospere Austria"></a>
        <a href="https://opencagedata.com"><img src="https://assets.opencagedata.com/assets/opencage-logo.green-9b2d61130a275515abf13dbe8c5e47a50fb9d4562da92b52f88c7dac85435dd3.svg" alt="Geocoding provided by Opencage">Geocoding services provided by OpenCage</a>
    </footer>

    <script src="main.js"></script>
</body>
</html>
